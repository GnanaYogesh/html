<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern Creative Studio</title>
    
    <!-- External CSS for global layout -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS for page-specific attractive elements -->
    <style>
        .hero {
            height: 80vh;
            /* Using a high-quality stock photo URL */
           
            background-size: cover;
            background-image: url("https://akm-img-a-in.tosshub.com/sites/resources/campus/prod/img/campusview/2023/7/screenshot-20230831-10335452092cf1c9a31569876853109.png");           
             background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(150, 211, 70);
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 50px;
            background-color: burlywood;
        }

        .gallery-card img {
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .gallery-card img:hover {
            transform: scale(1.05); /* Zoom effect on hover */
        }
        nav{
            background-color:burlywood;
        }
    </style>
</head>
<body >

    <nav >
        <div class="logo" ><strong >MEPCO</strong>Clg</div>
        <div class="links">Home • About • Contact</div>
    </nav>

    <header class="hero">
        <div>
            <h1>MEPCO SCHLENK ENGINEERING COLLEGE</h1>
            <p>(An Autonomous Institution)</p>
        </div>
    </header>

    <main class="image-gallery">
        <div class="gallery-card">
            <img src="https://images.unsplash.com" alt="Hostel">
        </div>
        <div class="gallery-card">
            <img src="https://images.unsplash.com" alt="Faculty">
        </div>
        <div class="gallery-card">
            <img src="https://images.unsplash.com" alt="Syllabus">
        </div>
    </main>

</body>
</html>
